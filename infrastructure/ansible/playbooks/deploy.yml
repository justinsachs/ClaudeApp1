---
- name: Deploy AI Course Platform
  hosts: app_servers
  become: yes
  vars:
    app_name: ai-course-platform
    app_user: ubuntu
    app_dir: /var/www/{{ app_name }}
    node_version: "20"
    pm2_app_name: "{{ app_name }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - curl
          - git
          - build-essential
          - nginx
          - certbot
          - python3-certbot-nginx
          - redis-server
        state: present

    - name: Check if Node.js is installed
      command: node --version
      register: node_installed
      ignore_errors: yes
      changed_when: false

    - name: Download Node.js setup script
      get_url:
        url: "https://deb.nodesource.com/setup_{{ node_version }}.x"
        dest: /tmp/node_setup.sh
        mode: '0755'
      when: node_installed is failed

    - name: Run Node.js setup script
      command: bash /tmp/node_setup.sh
      when: node_installed is failed

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
      when: node_installed is failed

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes
        state: present

    - name: Start and enable Redis
      systemd:
        name: redis-server
        state: started
        enabled: yes

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Create logs directory
      file:
        path: "{{ app_dir }}/logs"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Add GitHub to known_hosts (if using git)
      known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan -H github.com') }}"
        state: present
        path: /home/{{ app_user }}/.ssh/known_hosts
      become_user: "{{ app_user }}"
      when: git_repo_url is defined and 'github.com' in git_repo_url

    - name: Clone or update repository
      git:
        repo: "{{ git_repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch | default('main') }}"
        force: yes
        accept_hostkey: yes
      become_user: "{{ app_user }}"
      when: git_repo_url is defined

    - name: Copy application files (if using rsync instead of git)
      synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ app_dir }}"
        delete: yes
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=.git"
          - "--exclude=client/node_modules"
          - "--exclude=dist"
          - "--exclude=.env"
      become_user: "{{ app_user }}"
      when: git_repo_url is not defined

    - name: Copy environment file
      template:
        src: "../templates/env.j2"
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0600'

    - name: Remove node_modules to force fresh install
      file:
        path: "{{ app_dir }}/node_modules"
        state: absent

    - name: Install server dependencies
      npm:
        path: "{{ app_dir }}"
        state: present
      become_user: "{{ app_user }}"

    - name: Install client dependencies
      npm:
        path: "{{ app_dir }}/client"
        state: present
      become_user: "{{ app_user }}"

    - name: Build server
      command: npm run build:server
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Build client
      command: npm run build:client
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Run database migrations
      shell: |
        export $(cat {{ app_dir }}/.env | grep -v '^#' | xargs)
        npm run db:migrate:prod
      args:
        chdir: "{{ app_dir }}"
        executable: /bin/bash
      become_user: "{{ app_user }}"
      environment:
        NODE_ENV: production
        MIGRATIONS_FOLDER: "{{ app_dir }}/drizzle"

    - name: Check if PM2 process exists
      shell: pm2 list | grep {{ pm2_app_name }} || true
      become_user: "{{ app_user }}"
      register: pm2_check
      changed_when: false

    - name: Stop PM2 app if running
      command: pm2 delete {{ pm2_app_name }}
      become_user: "{{ app_user }}"
      when: pm2_check.stdout != ""
      ignore_errors: yes

    - name: Start application with PM2
      shell: |
        source {{ app_dir }}/.env
        pm2 start dist/server.js --name {{ pm2_app_name }} --time --log {{ app_dir }}/logs/pm2.log --error {{ app_dir }}/logs/pm2-error.log
      args:
        chdir: "{{ app_dir }}"
        executable: /bin/bash
      become_user: "{{ app_user }}"
      environment:
        NODE_ENV: production

    - name: Wait for PM2 to start process
      pause:
        seconds: 3

    - name: Check PM2 process status
      command: pm2 status
      become_user: "{{ app_user }}"
      register: pm2_status
      ignore_errors: yes

    - name: Show PM2 status
      debug:
        var: pm2_status.stdout_lines

    - name: Get PM2 logs if process failed
      command: pm2 logs {{ pm2_app_name }} --lines 50 --nostream
      become_user: "{{ app_user }}"
      register: pm2_logs
      ignore_errors: yes
      when: pm2_status.rc != 0

    - name: Show PM2 logs
      debug:
        var: pm2_logs.stdout_lines
      when: pm2_logs is defined and pm2_logs.stdout_lines is defined

    - name: Save PM2 process list
      command: pm2 save --force
      become_user: "{{ app_user }}"

    - name: Setup PM2 startup script
      shell: env PATH=$PATH:/usr/bin pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
      register: pm2_startup
      become: yes
      changed_when: false

    - name: Execute PM2 startup command if needed
      shell: "{{ pm2_startup.stdout_lines[-1] }}"
      become: yes
      when:
        - pm2_startup.stdout_lines is defined
        - pm2_startup.stdout_lines | length > 0
        - "'sudo' in pm2_startup.stdout"

    - name: Configure Nginx
      template:
        src: "../templates/nginx.j2"
        dest: "/etc/nginx/sites-available/{{ app_name }}"
        mode: '0644'

    - name: Enable Nginx site
      file:
        src: "/etc/nginx/sites-available/{{ app_name }}"
        dest: "/etc/nginx/sites-enabled/{{ app_name }}"
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded
        enabled: yes

    - name: Wait for application to start
      wait_for:
        port: 3000
        delay: 5
        timeout: 60

    - name: Check application health
      uri:
        url: "http://localhost:3000/health"
        status_code: 200
      retries: 3
      delay: 5
